name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Update Kotlin version
        run: |
          sed -i 's/version "1.7.10"/version "1.9.24"/g' android/settings.gradle
          sed -i 's/version "1.7.20"/version "1.9.24"/g' android/settings.gradle
          sed -i 's/version "1.8.0"/version "1.9.24"/g' android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: btec-guide-apk
          path: build/app/outputs/flutter-apk/app-release.apk
